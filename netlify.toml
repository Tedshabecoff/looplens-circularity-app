[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "http://circularity.looplens.co/*"
  to   = "https://circularity.looplens.co/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/api/generate-report"
  to   = "/.netlify/functions/generate-report"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
